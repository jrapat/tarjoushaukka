name: Päivitä juomahinnat automaattisesti

on:
  schedule:
    # Ajastettu ajo joka päivä klo 04:00 UTC (klo 06:00 Suomen talviaikaan / 07:00 kesäaikaan)
    - cron: '0 4 * * *'
  workflow_dispatch: # Mahdollistaa myös manuaalisen ajon napista GitHubissa

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # Annetaan oikeus kirjoittaa tiedostoja takaisin repositoryyn
    permissions:
      contents: write

    steps:
      - name: Hae repository koneelle
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Asenna vaaditut kirjastot ja selaimen riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install-deps chromium
          playwright install chromium

      - name: Aja skraikkaus-skripti
        run: python juomienselaus.py

      - name: Tallenna päivitetty data.json takaisin GitHubiin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automaattinen hintapäivitys [skip ci]" && git push)
